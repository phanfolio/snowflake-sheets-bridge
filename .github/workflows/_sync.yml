# Shared sync job. Never runs on its own: each project's caller workflow
# (sync-<project>.yml) invokes it with the project's name.
# See docs/workflows.md.
name: Sync (shared)

on:
  workflow_call:
    inputs:
      project:
        description: Folder under projects/. Must also be the name of a GitHub Environment.
        required: true
        type: string

jobs:
  sync:
    name: sync ${{ inputs.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.project }}        # supplies this project's SNOWFLAKE_* and GOOGLE_SHEET_ID
    concurrency:
      group: sync-${{ inputs.project }}       # one run per project at a time; projects run in parallel
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write                         # lets the job request a keyless Google token
    env:
      PROJECT_DIR: projects/${{ inputs.project }}
      # The Snowflake connector's compiled core probes for an AWS instance at login and logs
      # warnings when it isn't on one. This runner isn't on AWS, so skip the probe.
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --no-dev        # exact versions from uv.lock, no test tools; Python from .python-version

      - name: Validate config
        run: uv run snowsheets check "$PROJECT_DIR"

      - name: Google auth (keyless)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Google auth (JSON key fallback)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Publish
        run: uv run snowsheets run "$PROJECT_DIR"
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
