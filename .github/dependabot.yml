# Weekly update pull requests; the Tests workflow runs on each one.
#  - github-actions: the SHA-pinned actions in .github/workflows (updates the SHA and its "# vX.Y.Z" comment)
#  - uv: the Python dependencies pinned in uv.lock (within the ranges in pyproject.toml)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:          # one PR for all action updates instead of one per action
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:     # one PR for all dependency updates instead of one per package
        patterns: ["*"]
